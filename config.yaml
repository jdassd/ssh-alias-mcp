# SSH Manager — Global Configuration

# Path to the servers/ directory (can be absolute or relative to this config file)
servers_dir: 'D:/agents/servers'

proxy:
  # HTTP CONNECT; set enabled:false for an intentional direct connection.
  enabled: true
  type: http
  # Default endpoint: Windows 127.0.0.2:18080; Linux 127.0.0.1:18081.
  # Credentials: ~/.config/openvpn-http-proxy/proxy-auth.json.
  # Connection timeout when using proxy (seconds)
  timeout: 30

# Default settings for all servers (overridden by per-server config)
server:
  # Default SSH connection timeout (seconds)
  timeout: 30
  # Automatically reconnect on lost connection
  auto_reconnect: true
  # Interval between reconnection attempts (seconds)
  reconnect_interval: 5

# Global command filtering (per-server whitelist/blacklist overrides)
security:
  # Regex patterns to block commands (e.g., "rm -rf|mkfs|dd ")
  blacklist: []
  # Regex patterns to allow commands (empty = no restriction)
  whitelist: []
  # Command template to wrap all commands (use <command> as placeholder)
  command_template: ""
